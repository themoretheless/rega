[package]
name = "rega"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Social login & account registration via Google, Apple, Microsoft, GitHub, Facebook, X, LinkedIn, Discord, Yandex, VK, GitLab, Amazon"
license = "MIT"
repository = "https://github.com/themoretheless/rega"
keywords = ["oauth2", "oidc", "login", "auth", "social"]
categories = ["authentication", "web-programming"]

[dependencies]
aes-gcm = { version = "0.10", optional = true }
async-trait = "0.1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }
hmac = "0.12"
jsonwebtoken = "9.3"
rand = "0.8"
sqlx = { version = "0.8", optional = true, default-features = false, features = ["postgres", "runtime-tokio"] }
reqwest = { version = "0.12", default-features = false }
axum = { version = "0.8", optional = true, default-features = false, features = ["form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
url = "2"

[features]
default = ["rustls"]
## TLS via rustls (default).
rustls = ["reqwest/rustls-tls"]
## TLS via the platform library (OpenSSL / SChannel / Security.framework).
native-tls = ["reqwest/native-tls"]
## Ready-made axum routes `/auth/{provider}` and `/auth/{provider}/callback`.
axum = ["dep:axum", "cookie"]
## `PendingAuth::seal` / `PendingAuth::open` for storing login state in a cookie.
cookie = ["dep:aes-gcm"]
## `PgAccountStore`: PostgreSQL storage via sqlx.
postgres = ["dep:sqlx"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
proptest = "1"
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8", default-features = false, features = ["form", "query"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio"] }
criterion = { version = "0.5", default-features = false, features = ["async_tokio"] }

[[bench]]
name = "hot_paths"
harness = false
